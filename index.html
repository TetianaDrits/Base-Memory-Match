<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Memory</title>
<style>
  body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; }
  #grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; justify-content: center; margin-top: 20px; }
  .card { width: 70px; height: 70px; background: #0052FF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px; user-select: none; }
  .open { background: #00D395; color: #000; }
</style>
</head>
<body>
<h1>Base Contract Memory</h1>
<p>Найди пары парных технологий Base!</p>
<div id="grid"></div>
<script>
  const items = ['ETH', 'L2', 'GAS', 'NFT', 'SWAP', 'NODE', 'ETH', 'L2', 'GAS', 'NFT', 'SWAP', 'NODE'];
  items.sort(() => Math.random() - 0.5);
  let sel = [], matched = 0;
  const grid = document.getElementById('grid');
  items.forEach((item, i) => {
    const c = document.createElement('div');
    c.className = 'card'; c.innerText = '?';
    c.onclick = () => {
      if(sel.length < 2 && !c.classList.contains('open')) {
        c.classList.add('open'); c.innerText = item;
        sel.push({el: c, val: item});
        if(sel.length === 2) {
          if(sel[0].val === sel[1].val) { matched += 2; sel = []; if(matched === 12) alert('Все контракты найдены!'); }
          else { setTimeout(() => { sel.forEach(s => { s.el.classList.remove('open'); s.el.innerText = '?'; }); sel = []; }, 800); }
        }
      }
    };
    grid.appendChild(c);
  });
</script>
</body>
</html>
